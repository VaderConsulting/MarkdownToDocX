<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 585.6" style="max-width: 468px;" role="graphics-document document" xmlns:xlink="http://www.w3.org/1999/xlink"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .actor{stroke:#9370DB;fill:#ECECFF;}#mermaid-svg text.actor>tspan{fill:black;stroke:none;}#mermaid-svg .actor-line{stroke:#9370DB;}#mermaid-svg .innerArc{stroke-width:1.5;stroke-dasharray:none;}#mermaid-svg .messageLine0{stroke-width:1.5;stroke-dasharray:none;stroke:#333;}#mermaid-svg .messageLine1{stroke-width:1.5;stroke-dasharray:2,2;stroke:#333;}#mermaid-svg #arrowhead path{fill:#333;stroke:#333;}#mermaid-svg .sequenceNumber{fill:white;}#mermaid-svg #sequencenumber{fill:#333;}#mermaid-svg #crosshead path{fill:#333;stroke:#333;}#mermaid-svg .messageText{fill:#333;stroke:none;}#mermaid-svg .labelBox{stroke:#9370DB;fill:#ECECFF;}#mermaid-svg .labelText,#mermaid-svg .labelText>tspan{fill:black;stroke:none;}#mermaid-svg .loopText,#mermaid-svg .loopText>tspan{fill:black;stroke:none;}#mermaid-svg .loopLine{stroke-width:2px;stroke-dasharray:2,2;stroke:#9370DB;fill:#9370DB;}#mermaid-svg .note{stroke:#aaaa33;fill:#fff5ad;}#mermaid-svg .noteText,#mermaid-svg .noteText>tspan{fill:black;stroke:none;}#mermaid-svg .activation0{fill:#f4f4f4;stroke:#666;}#mermaid-svg .activation1{fill:#f4f4f4;stroke:#666;}#mermaid-svg .activation2{fill:#f4f4f4;stroke:#666;}#mermaid-svg .actorPopupMenu{position:absolute;}#mermaid-svg .actorPopupMenuPanel{position:absolute;fill:#ECECFF;box-shadow:0px 8px 16px 0px rgba(0,0,0,0.2);filter:drop-shadow(3px 5px 2px rgb(0 0 0 / 0.4));}#mermaid-svg .actor-man line{stroke:#9370DB;fill:#ECECFF;}#mermaid-svg .actor-man circle,#mermaid-svg .actor-man line{stroke:#9370DB;fill:#ECECFF;stroke-width:2px;}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><defs><marker id="mermaid-svg_sequence-arrowhead" viewBox="0 0 12 12" refX="7.9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M -1 0 L 10 5 L 0 10 z" fill="none" stroke="#333333" stroke-width="1" stroke-linejoin="round"/></marker><marker id="mermaid-svg_sequence-filled-head" viewBox="0 0 20 28" refX="15.5" refY="7" markerWidth="20" markerHeight="28" orient="auto"><path d="M 18,7 L9,13 L14,7 L9,1 Z" fill="#333333" stroke="#333333" stroke-width="1" stroke-linejoin="round"/></marker><marker id="mermaid-svg_sequence-crosshead" viewBox="0 0 15 8" refX="4" refY="4.5" markerWidth="15" markerHeight="8" orient="auto"><path fill="none" stroke="#333333" style="stroke-dasharray: 0, 0" stroke-width="1pt" d="M 1,2 L 6,7 M 6,2 L 1,7"/></marker><filter id="naiad-node-shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/><feOffset in="blur" dx="2" dy="4" result="offsetBlur"/><feFlood flood-color="#000000" flood-opacity="0.22" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="20" y="20" width="183.04" height="64.8" rx="3" ry="3" fill="#ECECFF" stroke="#9370DB" stroke-width="1" class="actor" filter="url(#naiad-node-shadow)"/><text x="111.52" y="57.4" text-anchor="middle" dominant-baseline="middle" font-size="16px" font-family="Arial, sans-serif">   Client   </text><rect x="255.04" y="20" width="192.96" height="64.8" rx="3" ry="3" fill="#ECECFF" stroke="#9370DB" stroke-width="1" class="actor" filter="url(#naiad-node-shadow)"/><text x="351.52" y="57.4" text-anchor="middle" dominant-baseline="middle" font-size="16px" font-family="Arial, sans-serif">   Service   </text><line x1="111.52" y1="84.8" x2="111.52" y2="500.8" stroke="#9370DB" stroke-width="1" stroke-dasharray="5,5"/><line x1="351.52" y1="84.8" x2="351.52" y2="500.8" stroke="#9370DB" stroke-width="1" stroke-dasharray="5,5"/><line x1="111.52" y1="136.8" x2="351.52" y2="136.8" stroke="#333" stroke-width="1" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="121.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">Request</text><line x1="351.52" y1="188.8" x2="111.52" y2="188.8" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="173.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">200 OK</text><line x1="351.52" y1="240.8" x2="111.52" y2="240.8" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="225.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">500 Error</text><line x1="111.52" y1="292.8" x2="351.52" y2="292.8" stroke="#333" stroke-width="1" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="277.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">Retry request</text><line x1="351.52" y1="344.8" x2="111.52" y2="344.8" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="329.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">Result</text><line x1="111.52" y1="396.8" x2="351.52" y2="396.8" stroke="#333" stroke-width="1" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="381.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">Fire-and-forget</text><line x1="351.52" y1="448.8" x2="111.52" y2="448.8" stroke="#333" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#mermaid-svg_sequence-filled-head)"/><text x="231.52" y="433.8" text-anchor="middle" dominant-baseline="bottom" font-size="16px" font-family="Arial, sans-serif">Event</text><rect x="346.52" y="292.8" width="10" height="208" fill="#F4F4F4" stroke="#666" stroke-width="1"/><rect x="20" y="500.8" width="183.04" height="64.8" rx="3" ry="3" fill="#ECECFF" stroke="#9370DB" stroke-width="1" class="actor" filter="url(#naiad-node-shadow)"/><text x="111.52" y="538.2" text-anchor="middle" dominant-baseline="middle" font-size="16px" font-family="Arial, sans-serif">   Client   </text><rect x="255.04" y="500.8" width="192.96" height="64.8" rx="3" ry="3" fill="#ECECFF" stroke="#9370DB" stroke-width="1" class="actor" filter="url(#naiad-node-shadow)"/><text x="351.52" y="538.2" text-anchor="middle" dominant-baseline="middle" font-size="16px" font-family="Arial, sans-serif">   Service   </text></svg>