<svg xmlns="http://www.w3.org/2000/svg" width="240" height="286" viewBox="0 0 240 286"><rect x="0" y="0" width="239.84" height="286" fill="white"/><path d="M8,8 H231.84 V278 H8 Z" fill="#ECECFF" stroke="#9370DB" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text y="40.76" text-anchor="middle" fill="#333" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16" font-weight="normal"><tspan x="119.92" dy="0">This node label is</tspan><tspan x="119.92" dy="24">deliberately verbose</tspan><tspan x="119.92" dy="24">so the renderer must</tspan><tspan x="119.92" dy="24">wrap text inside the</tspan><tspan x="119.92" dy="24">node boundary</tspan><tspan x="119.92" dy="24">instead of</tspan><tspan x="119.92" dy="24">overflowing the</tspan><tspan x="119.92" dy="24">subgraph or page</tspan><tspan x="119.92" dy="24">margins when</tspan><tspan x="119.92" dy="24">embedded in Word.</tspan></text></svg>