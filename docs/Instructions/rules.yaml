    pictures: []
    hint_overridable: false
    order: 86
    blank_before: 1
    text: |-
      A line never runs along a connection boundary, a visible node outline or a frame edge. It crosses a frame only at a right angle. A line to or from a group follows rule 4.9.
  - id: "4.7"
    title: "Port placement"
    title_in_text: false
    section: "S4"
    kind: "legality"
    stage: "R2"
    status: "active"
    pointer: ""
