terms:
  - id: "term.grid-step"
    name: "Grid step"
    qualifier: ""
    section: "terms"
    order: 10
    blank_before: 1
    text: |-
      30 px. This is the fine drawing grid for frame edges, tracks and gap growth. Nodes and linked groups are placed and moved by whole logical cells (term Grid, rule 1.2). Ports, arrowheads, rounded-corner geometry and text bounds are continuous drawing coordinates and may be fractional.
  - id: "term.grid"
    name: "Grid"
    qualifier: ""
    section: "terms"
    order: 11
    blank_before: 1
    text: |-
      the logical placement grid of a `grid`-mode diagram: one shared set of columns and rows of **base cells**, with a column gap between neighbouring columns and a rank gap between neighbouring rows. Every base cell has the same base cell width and base cell height (1.3). A cell is a unit of occupancy, not a drawn border. A rectangular node's **occupied region** is one contiguous rectangle of whole cells, given by its start row, start column, row span and column span; both spans are positive integers. The node's rendered rectangle is its whole occupied region, including the gaps between its own cells. The gaps round the region separate it from other nodes and follow the spacing rules. Column gaps and rank gaps need not be equal, and a gap may grow by whole grid steps for routing, labels and frames (1.5, 1.7, 7.3); growth changes the gap, never the base cell dimensions. A node that spans a grown gap includes the grown gap. In `open` mode, the logical grid does not apply. A span has no maximum. A node's region is never L-shaped, never skips a row or column and never consists of separate cells. A node that spans several cells is still one node, with one id, label, shape, set of relationships, group membership and set of hints, and one continuous connection boundary (term Node geometry); spanning creates no extra nodes, relationships or ports. The node reserves every cell of its region, and occupancy is read only from regions, never from node positions or midpoints. There are no local grids, per-node pixel offsets or per-cell distortions. The base cell width and height are configured parameters (1.3), set before any label is fitted and fixed for the whole layout. An **internal gap** lies between cells of the same node; an **external gap** separates different occupied regions.
  - id: "term.rank"
    name: "Rank"
    qualifier: ""
    section: "terms"
    order: 12
    blank_before: 1
    text: |-
      a node's row in flow order. Mermaid's ranking gives the starting rank. A line is **forward** when its target is in a later rank.
  - id: "term.gap"
    name: "Gap"
    qualifier: ""
    section: "terms"
    order: 13
    blank_before: 1
    text: |-
      the clear space between two neighbouring rows of cells (rank gap) or columns of cells (column gap). A gap inside a node's occupied region is part of that node; a gap between separate nodes keeps them apart. Base rank gap: 2 grid steps, providing a default routing corridor for 20 px rounded corners, arrowhead clearance and independently allocated tracks; it is not derived from a universal 50 px straight-run requirement. Base column gap: 1 grid step.
  - id: "term.track"
    name: "Track"
    qualifier: ""
    section: "terms"
    order: 14
    blank_before: 1
    text: |-
      a line inside a gap, parallel to the gap, on which a straight run travels. Tracks are 1 grid step apart; the first track is the gap's centre line. Each track carries one line where runs overlap (rule 5.1).
  - id: "term.port"
    name: "Port"
    qualifier: ""
    section: "terms"
    order: 15
    blank_before: 1
    text: |-
      the point where one line meets a node outline. Box and diamond edges each accept any number of distinct ports, distributed symmetrically at k/(n+1) along the edge (3.2); a single line uses the edge centre. Diamond vertices are the four tips, not mandatory branch ports. Every port lies exactly on the node's connection boundary (term Node geometry).
  - id: "term.sides"
    name: "Sides"
    qualifier: ""
    section: "terms"
    order: 16
    blank_before: 1
    text: |-
      the **upstream side** faces earlier ranks (top); the **downstream side** faces later ranks (bottom). The **side that faces the target** (on a source) or **the side that faces the source** (on a target) is whichever of top, bottom, left or right faces the other end; the **far side** is the opposite side. A side or port is **free** when no line uses it.
  - id: "term.straight-run"
    name: "Straight run"
    qualifier: ""
    section: "terms"
    order: 17
    blank_before: 1
    text: |-
      a straight segment. Ordinary runs are horizontal or vertical; the initial run leaving or entering a sloped diamond edge is the sole exception and follows the edge normal (3.1). Diamond branches travel at least 50 px along that normal before turning onto the grid; other lines require at least 20 px before a corner and an arrowhead-length terminal run. A straight line with no corner needs no artificial source-side clearance.
  - id: "term.corner"
    name: "Corner"
    qualifier: ""
    section: "terms"
    order: 18
    blank_before: 1
    text: |-
      normally a quarter-circle of radius 20 px joining two orthogonal straight runs at a right angle. A diamond-edge-normal run turning onto the grid uses a tangent transition for its actual change of direction, with the same 20 px minimum bend radius; it need not be a quarter-circle. An **elbow** has 1 corner. A **Z** has 2 corners, and its first and last runs point the same way.
  - id: "term.main-path"
    name: "Main path"
    qualifier: ""
    section: "terms"
    order: 19
    blank_before: 1
    text: |-
      see rule 2.18.
  - id: "term.branch"
    name: "Branch"
    qualifier: ""
    section: "terms"
    order: 20
    blank_before: 1
    text: |-
      a path that leaves a main-path node and is not on the main path. A **detour** rejoins the main path at the next main-path node. An **early exit** ends, or rejoins the main path further on. A **loop branch** ends in a back edge.
  - id: "term.back-edge"
    name: "Back edge"
    qualifier: ""
    section: "terms"
    order: 21
    blank_before: 1
    text: |-
      a line whose target is in an earlier rank than its source. Its **return track** is the track it runs on, outside every node it passes.
  - id: "term.fan"
    name: "Fan"
    qualifier: ""
    section: "terms"
    order: 22
    blank_before: 1
    text: |-
      2 or more lines on one side of one node that go to, or come from, nodes in one rank.
  - id: "term.group-frame"
    name: "Group / frame"
    qualifier: ""
    section: "terms"
    order: 23
    blank_before: 1
    text: |-
      a group is a Mermaid subgraph; its frame is the rectangle drawn round its members. Every frame has a title strip at the top and 1 grid step of padding on each side.
  - id: "term.label-gap"
    name: "Label gap"
    qualifier: ""
    section: "terms"
    order: 24
    blank_before: 1
    text: |-
      the width of the letter "n" in the label font. It is the clear space between a label's text and its line on each side.
  - id: "term.main-link"
    name: "Main link"
    qualifier: ""
    section: "terms"
    order: 25
    blank_before: 1
    text: |-
      the line to or from the node's one parent, or its first declared incoming line when it has several.
  - id: "term.strongest-flow"
    name: "Strongest flow"
    qualifier: "(the longest decision-free run)"
    section: "terms"
    order: 26
    blank_before: 1
    text: |-
      the flow with the most nodes from its start, or from the last decision, to the converging node; the first declared wins a tie.
  - id: "term.cluster"
    name: "Cluster"
    qualifier: ""
    section: "terms"
    order: 27
    blank_before: 1
    text: |-
      see rule 2.20.
  - id: "term.peer"
    name: "Peer"
    qualifier: ""
    section: "terms"
    order: 28
    blank_before: 1
    text: |-
      an element, note or group at the required nesting level in the same group; see rule 2.21(c).
  - id: "term.honoured"
    name: "Honoured"
    qualifier: ""
    section: "terms"
    order: 29
    blank_before: 1
    text: |-
      the final placement or route geometry satisfies the retained hint; horizontal and vertical placement axes are honoured or dropped independently; see rule 2.21.
  - id: "term.note"
    name: "Note"
    qualifier: ""
    section: "terms"
    order: 30
    blank_before: 1
    text: |-
      a free-text box with a dog-ear corner; see rule 2.22. A **plain connection** is an undirected line to or from a note; see rule 4.10.
  - id: "term.nearest-free-cell"
    name: "Nearest free cell"
    qualifier: ""
    section: "terms"
    order: 31
    blank_before: 1
    text: |-
      the free cell region of the required spans with the fewest grid steps from the target region, trying the same rank first, then earlier ranks, then left before right.
  - id: "term.forced-minimum"
    name: "Forced minimum"
    qualifier: ""
    section: "terms"
    order: 32
    blank_before: 1
    text: |-
      see rule 2.13.
  - id: "term.wrapped"
    name: "Wrapped"
    qualifier: ""
    section: "terms"
    order: 33
    blank_before: 1
    text: |-
      cut into rows or columns by rule 2.12.
  - id: "term.node-geometry"
    name: "Node geometry"
    qualifier: ""
    section: "terms"
    order: 34
    blank_before: 1
    text: |-
      every node has three geometries. **Visual bounds** are the complete visible extent of the rendered node, including decorative overhangs and projections. The **connection boundary** is the shape-specific boundary on which ports may be placed; it may differ from the outermost visible outline and may consist of several edges or segments. **Obstacle geometry** is the complete occupied geometry of the node, including decorative overhangs and projections, which unrelated lines and nodes must not intersect. For an ordinary rectangular node all three coincide. For a node with decorative features, the connection boundary may follow the main body rather than those features. Every connection ends exactly at its allocated port on the connection boundary. A line may approach its own node only along the permitted approach to that port and never passes through the node's occupied geometry. Decorative features give no extra ports unless the shape defines them as eligible. The shape renderer supplies all three geometries as part of its contract, and the router uses them without shape-specific logic. Until a shape supplies its own definitions, all three default to its rectangle, which is the current behaviour. Collision detection uses the actual obstacle geometry where it is available, rather than treating the bounding rectangle as solid. Example: a contract shape's rectangular body is its connection boundary, and its top overhang is visual bounds and obstacle geometry only. A line from the right ends at the body's right edge, not at the overhang's rightmost point, and unrelated lines may not cross the overhang. For the wavy-bottom representation shape, the bottom connection boundary follows the wave's midline; an arrowhead tip may touch the wave but never crosses it.
