    outranks: []
    yields: ["2.10"]
    pictures: []
    hint_overridable: true
    order: 48
    blank_before: 1
    text: |-
      Put a node with several parents under its first parent that has no other child directly below it, taking parents in Mermaid's order. If every parent has one, keep the node's snapped column (1.6). Inside a 2.10 block, 2.10 decides which source a target sits under.
  - id: "2.5"
    title: "Several children"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P4"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.17","2.18","2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 49
    blank_before: 1
    text: |-
      If a node has several children, prefer directly below it the main-path child (2.18), or off the main path the longest-path child (the child with the longest path to a terminal node). Place remaining children by 2.17, subject to clearance and honoured hints.
  - id: "2.6"
    title: "Detours and early exits"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P4"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 50
    blank_before: 1
    text: |-
      Put detours in the column next to the main path, in the ranks between the two main-path nodes they join. Put early exits in the column beyond the detours. Put both on the side of the main path where Mermaid placed most of them; on a tie, use the left side. A second branch from the same diamond goes on the opposite side.
  - id: "2.7"
    title: "Diamond with loop child"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P3"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.18"]
    outranks: []
    yields: []
    pictures: ["wait-loop-markup.png","cycle-grid-markup.png"]
    hint_overridable: true
    order: 51
    blank_before: 1
    text: |-
      When a diamond has two children, one on the main path and one starting a loop branch, keep the main-path child directly under the diamond (rule 2.18) and put the loop child in the next column, one rank lower, on the side Mermaid placed it. Prefer a straight main-path connection only when the allocated symmetric ports align; otherwise use the fewest legal corners (see wait-loop-markup.png, cycle-grid-markup.png).
  - id: "2.8"
    title: "Chains through groups"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P4"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: []
