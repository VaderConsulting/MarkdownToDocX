    text: |-
      Build ordinary line paths from horizontal/vertical straight runs and 20 px rounded right-angle corners. **Sole exception:** the first straight run leaving, or final straight run entering, a sloped diamond edge is perpendicular to that edge and may be diagonal. After the required minimum straight run, it turns onto the horizontal/vertical grid; that transition is an allowed diamond-edge direction change, not a forbidden diagonal grid run. Do not use arbitrary diagonal detours, S-curves, free curves or hop arcs.
