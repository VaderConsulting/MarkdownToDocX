    pictures: ["nested-chain-markup.png"]
    hint_overridable: true
    order: 52
    blank_before: 1
    text: |-
      A chain of nodes that each have one parent and one child stays in one column as it passes into and out of a group (see nested-chain-markup.png).
  - id: "2.9"
    title: "Pointer to 2.10"
    title_in_text: false
    section: "S2"
    kind: "structure/pointer"
    stage: "P4"
    status: "active"
    pointer: "2.10"
    params: []
    refs: ["2.10"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 53
    blank_before: 1
