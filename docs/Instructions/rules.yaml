      For a diamond branch to a target directly below, choose a downward-facing edge port and route its perpendicular initial run for at least 50 px before turning onto the grid. Continue by the fewest legal corners; move an unhinted child by whole grid columns if required for corner clearance (2.17). A route is straight only if the required normal departure and target geometry align.
  - id: "3.8"
    title: "Decision branches"
    title_in_text: true
