      See rule 2.10 (two-by-two is one case of it).
  - id: "2.10"
    title: "Block of lines between two ranks"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P4"
    status: "active"
    pointer: ""
    params: []
    refs: ["1.7","3.2","3.3","5.1","5.9"]
    outranks: []
    yields: []
    pictures: ["cross-links-markup.png","many-to-many-markup.png"]
    hint_overridable: true
    order: 54
    blank_before: 1
    text: |-
      Block of lines between adjacent ranks (any number of sources and targets). Swap nodes within a rank when that improves the score without breaking higher-priority placement or hints. Order targets by the source supplying the most lines (tie: the mean of the sources' representative columns, where a source occupying columns A to B has representative column (A + B)/2, using rows instead in left-right diagrams; these are ordering values only and never set placement or allow fractional occupancy; then Mermaid order). Prefer a straight connection when the **allocated symmetric ports actually align**; otherwise route with the fewest legal corners. Every other line leaves and enters at ports allocated jointly and symmetrically (3.2, 3.3). Use separate overlapping tracks (5.1), remove avoidable crossings (5.9), and allow only right-angle crossings inside gaps. Do not introduce hops, side detours or frame-edge runs. Grow gaps only for legality (1.7).
  - id: "2.11"
    title: "Compaction"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P6"
    status: "active"
    pointer: ""
    params: ["grid_step"]
    refs: ["2.12","2.13","2.14","2.17","2.20","2.21","4.2","7.8"]
    outranks: []
    yields: ["2.17","2.18","2.21"]
    pictures: []
    hint_overridable: true
    order: 55
    blank_before: 1
    text: |-
      Compaction (`grid` only). After initial placement and routing, visit nodes in rank order, then left to right. Consider moving an unhinted node by whole cells, keeping its spans, to a nearer legal position, including beside a parent when 2.17 permits it. **Never move a main-path node sideways for compaction**; a deliberate wrap fold (2.12) is the sole automatic exception. Retain a move only when the complete candidate satisfies the applicable rules and has a strictly lower score (2.13). After a move, reroute affected connections under 4.2. Move clusters as units unless an honoured hint requires a different arrangement (2.20–2.21); group membership and frame containment remain governed by 7.8. Remove only genuinely unused rows/columns; never shrink a gap needed for labels, tracks, corners or frames. Repeat until rule 2.14 stops the search. Compaction never splits, shrinks, collapses or enters a spanning node's region and never produces a fractional size; main-path and hint restrictions still apply.
  - id: "2.12"
    title: "Wrapping"
    title_in_text: false
    section: "S2"
    kind: "quality"
    stage: "P7"
    status: "active"
    pointer: ""
    params: ["target_aspect_width","target_aspect_height","base_cell_width","base_cell_height"]
    refs: ["1.3","2.11","2.13","2.14","2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 56
    blank_before: 1
    text: |-
      Wrapping (`grid` only). After compaction, wrap overlong rows or columns into successive rows/columns to approach 4:3 without worsening the complete legal-layout score. There is no fixed diagram-size or node-count limit. Preserve source order and honoured hints. A long main path **may fold only at an explicit wrap boundary**: each uninterrupted section remains aligned, and the connecting edge is routed under sections 3–5. The fold is not an ordinary sideways compaction move. Aspect ratio is a small score cost, never a hard admission limit for a legal candidate. Wrapping never splits a group unless the group itself exceeds the selected wrap length. Run compaction after wrapping and keep only strictly improving candidates (2.14). Tests compute expected dimensions from measured node sizes and gaps and never hard-code pixel dimensions. Wrapping never splits a node across rows or columns; the 4:3 shape remains a quality objective only.

      - The wrap length is the number of cells across, or down, that brings the whole diagram closest to 4:3 (width 4 parts to height 3 parts), without raising the rule 2.13 score. Never wrap a row or column that already fits within the wrap length. The shape is a ratio of the diagram's own computed size, with no fixed pixel size or node limit.

      - Wide: cut a row longer than the wrap length into rows of at most that length. Draw the first nodes across, then start the next row directly under the previous row, in the same columns, one rank gap below.

      - Deep: cut a column longer than the wrap length into columns of at most that length. Draw the first nodes down, then start the next column directly to the right of the previous column, one column gap away.

      - Keep the order of the nodes: the next row or column continues from the node after the last one in the previous row or column.

      - One line joins the pieces. For a wrapped row, it leaves the bottom of the far-right node, runs back along a track in the gap, and enters the top of the first node of the next row. For a wrapped column, it leaves the right side of the bottom node, runs along a track in the gap, and enters the left side of the first node of the next column. This line follows sections 3 to 5 like any other line.

      - Wrapping never splits a group frame unless the group is itself longer than the wrap length. Nodes of one group stay together.

      - After wrapping, run compaction (rule 2.11) again, so that wrapped rows and columns pack closer. A diagram can need both wide and deep wrapping. Compaction and wrapping repeat in passes; candidates are scored and kept, and the loop stops, as set by rules 2.13 and 2.14.

      - The wrap length is counted in base cells (rule 1.3); a node that spans several columns or rows counts its full span. Tests compute the expected size from measured node sizes and the gaps, and never hard-code a pixel size or a node limit.
  - id: "2.13"
    title: "Layout score"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P8"
    status: "active"
    pointer: ""
    params: ["target_aspect_width","target_aspect_height","score_shape_points","score_shape_step","score_empty_points_low","score_empty_threshold","score_empty_points_high","score_crossing","score_bend","score_disconnected_end","score_hint_node_group","score_hint_line","score_route_length_per_grid_step"]
    refs: ["2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 57
    blank_before: 1
    text: |-
      Layout score. Score each **legal, routing-fault-free (unless hinted)** candidate of the same diagram: shape + empty + crossings + bends + disconnected ends + hints; lower is better. Shape: 2 points per 5% deviation from 4:3, prorated; this is a small cost, never an admission condition or a hard limit. Empty: 10 points per 5% uncovered area through 30%, then 40 per 5% above 30%, prorated; measure against node boxes, group frame/title space, labels and occupied tracks. Crossings: 20 points per crossing **above a defensible forced minimum**, prorated only where meaningful. The forced minimum is the minimum under the permitted node/port/track orderings; do not assume a closed-form complete-bipartite formula applies to unrestricted orthogonal routing. Where it cannot be established, use zero as a conservative lower bound. Crossings up to that minimum are reported but unpenalised. Bends: 20 points per corner. Disconnected ends: 20 per unmatched drawn line end (but such ends are prohibited by section 10, so legal candidates normally have zero). Hints: -30 per independently honoured placement-axis hint of an element, note or group, and -15 per fully honoured connection-level line hint, including plain note connections (2.21). Tests calculate expected scores from the measured layout and never hard-code a pixel size. The score cannot legalise a forbidden crossing, routing fault or overlap; it is not a pass mark. Read all weights from this rules file. Score from final rendered sizes. Gaps inside a node's region count as occupied area, not empty space. A node that spans more than one cell earns no penalty for its span. Length. Add one bounded route-length term to each complete legal candidate. Let L be the total final route length divided by the base routing grid unit, w be score_route_length_per_grid_step, and B be the smaller of score_bend and score_crossing. The length term is wL / (1 + wL/B). Add it once for the whole layout, not once per line. It is nonnegative and strictly less than B for every finite route length, so length alone cannot outweigh one bend or crossing. Measure complete terminal runs as well as interior tracks. Compare length exactly when the bend-and-crossing costs tie; a fixed score epsilon must not discard a real length improvement. Hints and all legality and routing-fault admission checks remain higher priority. The existing added-length and moved-line repair terms and limits under 5.10 remain separate and unchanged.
  - id: "2.14"
    title: "Keep the best"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P8"
    status: "active"
    pointer: ""
    params: ["score_empty_threshold"]
    refs: ["1.7"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 58
    blank_before: 1
    text: |-
      Keep the best. Compare complete legal candidates; accept only a strictly lower score. Stop after a full pass without improvement or a repeated layout signature. A finite deterministic candidate enumeration and a visited-layout set prevent cycles; do not impose an arbitrary diagram-size limit. Report any independently unsatisfiable hard constraint rather than expanding indefinitely (1.7). Empty space above 30% is a reported quality result, not a conversion failure. A candidate's state and layout signature include every node's start row, start column, row span and column span.
  - id: "2.15"
    title: "Unconnected pieces"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.12","7.8"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 59
    blank_before: 1
    text: |-
      Unconnected pieces. Arrange disconnected nodes or connected pieces in declared order, left-to-right then top-to-bottom. Compute the block’s own wrap length from its measured member dimensions and spacing by selecting the legal arrangement nearest 4:3; do not depend on the whole-diagram wrap length (2.12). A cluster is initially one piece. Every member stays within its owning group (7.8), whose frame grows to fit.
  - id: "2.16"
    title: "Fans"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.17","2.21","5.2","5.8"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 60
    blank_before: 1
    text: |-
      Fans. Arrange fan members into a local block whose wrap length is chosen from the fan block’s own measured dimensions and gaps to approach 4:3; do not depend on the overall diagram wrap length. Where permitted, place the source or target beside the block, in the rows (or columns) the block occupies, balanced so that the block extends about equally on either side of it; this balance is a quality preference. This specific rule overrides generic 2.17 placement, subject to hints and legality. Route fan lines by 5.2 and 5.8, including nested tracks. Avoid removable crossings and hops. Fan members may have different spans; never require equal sizes.
  - id: "2.17"
    title: "Under the parent"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.16","2.4","2.21","3.2","3.8"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 61
    blank_before: 1
    text: |-
      Under the parent. Prefer to place a child in the rows directly below its parent, with its columns inside or overlapping the parent's columns, when its allocated ports permit a legal route. Where the spans allow, prefer the child's columns to sit evenly within the parent's columns, for example a 2-column child in the middle 2 columns of a 4-column parent; this visual alignment is a quality preference, not a legality requirement. For multiple children retain symmetric port allocation (3.2) and arrange the children's regions across the columns in port order. If a port away from the middle of its edge and a child directly below would require two corners with insufficient horizontal clearance, move the unhinted child outward by whole columns until the required horizontal and vertical runs fit; adding vertical rank-gap space alone does not fix horizontal clearance. A child may grow in any direction (1.2), and parent and child need not have the same spans; their allocated ports decide whether a straight connection is possible. There is no alignment score; alignment is rewarded only through straight connections and the bend and crossing terms. Never resize a node to fit under its parent. Main-path alignment is preferred but not forced against port geometry. Decisions follow 3.8, fans follow 2.16, and multiple parents follow 2.4. Never assume nodes have equal sizes; compare occupied regions.
  - id: "2.18"
    title: "Main path"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P2"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.12","2.17","2.21","4.11"]
    outranks: ["2.11"]
    yields: []
    pictures: ["main-spine-markup.png"]
    hint_overridable: true
    order: 62
    blank_before: 1
    text: |-
      Main path. Select the path by longest decision-free continuation, with Mermaid order breaking ties; convergence follows the strongest incoming flow. Prefer to keep main-path nodes in one run of shared columns: each node's columns overlap those of the node before it so that their allocated ports can align, and the edge between them is straight when they do. At convergence, place the rejoining node in the rows below the main-path node feeding it, with overlapping columns, when legal; otherwise use the nearest free cell region and 4.11. Reserve the actual outline port for a legal straight main-path edge before symmetric allocation of the other ports. Reposition unhinted children by whole columns to make routes from ports away from the middle of an edge legal (2.17). Neither compaction nor coupled repair may move a main-path node sideways; only an explicit wrap fold (2.12) or honoured hint may do so. A node that rejoins remains on the main path.
  - id: "2.19"
    title: "Free direction"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P8"
    status: "active"
    pointer: ""
    params: []
    refs: ["1.1","2.13","2.14","2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 63
    blank_before: 1
    text: |-
      Free direction. When a diagram declares no direction, the engine tries each flow direction (down, right, up, left) and keeps the layout with the lowest score (rules 2.13 and 2.14), so a simple chain comes out as a straight run with the fewest corners. When a direction is declared, it is used and not changed. Hints (rule 2.21) apply inside the direction in use and never change a declared direction; with none declared, each trial scores its own honoured hints. There is no size threshold: the same rule applies to small and large diagrams. Each trial applies rule 1.1 to its direction, and Mermaid's ranks are recomputed for it. Trials may run in parallel and reuse results.
  - id: "2.20"
    title: "Clusters"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.10","2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 64
    blank_before: 1
    text: |-
      Clusters. Identify clusters from relationship connectivity only, never labels. A cluster does not cross a group frame; nodes belong to at most one cluster, and otherwise form single-node clusters. Move and wrap clusters as units **unless an honoured hint requires a different legal arrangement**; hints outrank clustering and must not be refused merely because they distort or split an automatic cluster. If needed, dissolve or recompute the affected cluster around the honoured hint while preserving group membership and geometry. Choose internal order to minimise crossings under higher-priority rules. Between clusters use 2.10. Cluster detection must have a deterministic tie-break based on source order. A cluster reserves its members' full occupied regions and moves them intact.
  - id: "2.21"
    title: "Hints"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P1"
    status: "active"
    pointer: ""
    params: ["score_bend","score_hint_node_group","score_hint_line"]
    refs: ["1.1","1.7","2.13","2.19","5.7","7.8"]
    outranks: ["2.4","2.5","2.6","2.7","2.8","2.9","2.10","2.11","2.12","2.13","2.14","2.15","2.16","2.17","2.18","2.19","2.20","routing-faults.1"]
    yields: ["legality"]
    pictures: []
    hint_overridable: false
    order: 65
    blank_before: 1
    text: |-
      Hints. Hints override automatic placement and routing, but never hard legality. An honoured line hint may explicitly permit the routing fault it identifies. An honoured node or group placement hint can make a tier-3 routing fault unavoidable; keep the hint, report and score that fault under 2.13 rather than dropping the hint to remove the fault. A placement hint never permits a section 10 legality fault. Hints outrank automatic clusters, compaction, wrapping and main-path preferences. Resolve contradictory hints in source order (d). Report impossible hints alongside the fallback diagram.

      - (a) Written: a node, note or group hint is written after its declaration's label, before or after its `in` clause. Horizontal hints are left-of or right-of a named peer, optionally followed by +n, or push E or W. Vertical hints are above or below a named peer, optionally followed by +n, or push N or S. A declaration carries at most one effective hint on each axis. A further hint on an axis that already has one is dropped and reported, and hints on one axis are never combined. A line hint is written in square brackets after the relationship: leave, enter or travel, each followed by N, S, E or W, separated by commas. Every direction word is relative to the reader's view of the finished page, whatever the diagram direction (rule 1.1).

      - (b) Meaning: a relative hint is a relationship to its peer's complete final occupied region, not a stored cell. In zero-based logical cells: right-of P +n gives StartColumn = P.StartColumn + P.ColumnSpan + n; left-of P +n gives StartColumn = P.StartColumn - Node.ColumnSpan - n; below P +n gives StartRow = P.StartRow + P.RowSpan + n; above P +n gives StartRow = P.StartRow - Node.RowSpan - n. The standard column gap or rank gap between the two regions is always kept. Recalculate the position whenever the peer moves or the relevant span of either node changes. The hinted node's whole region must be free, and the final layout never contains an overlap. A node with a hint on one axis only takes its peer's start row (or column) on the other axis. If its region is occupied, it moves further in the hinted direction by whole cells and never changes that start row or column. A node with hints on both axes has both start coordinates fixed by its relationships. "push D" places the node just beyond, in direction D, the occupied envelope of its reference set: every sibling (same parent) without a push hint, plus every sibling whose push hint comes earlier in source order. The node itself and later-pushed siblings are excluded. The node keeps its coordinate on the other axis. A push may enlarge the group or diagram, and successive pushes stack outward in source order. A later push never invalidates an earlier honoured push. Re-evaluating with unchanged reference regions must not move the node. When reference regions grow or move, recalculate in source order. With an empty reference set, drop the hint and report "no sibling reference region". "leave D" and "enter D" name the side of the source box and of the target box that the line uses. "travel D" is the direction of the line's middle run, so a straight line, which has no middle run, cannot honour travel.

      - (c) Peers: a peer must be an element, note or group at the same nesting level in the same group. A missing or cross-group peer causes the hint to be dropped and reported. Peer circles are detected separately on each axis. A valid peer may belong to another automatic cluster: honour the hint first, then move, split or recompute clusters without breaking group membership or geometry.

      - (d) Order and conflicts: take hints in source order. A hint that closes a circle of peers on its axis is dropped and reported, and the earlier hints stay. For line hints, two lines hinted to the same port on one box side is a conflict, and the later hint is dropped and reported. Within one line hint, each invalid or repeated part is dropped and reported, the first of a repeated part is kept, and the valid parts stay. Hints may request overlapping occupancy, but the final layout must never contain an overlap. Resolve occupancy with the deterministic legal-repair process, which includes moving whole dependency chains. A neighbour may move only if every higher-priority constraint still holds, including its own honoured hints. An honoured node never leaves either of its hint relationships unless that hint is explicitly dropped and reported. Drop the later axis of a node in source order only after the repair process has used up its permitted candidates, subject to the same higher-priority constraints. Report it as "conflicting constraints" when the conflict is established, and otherwise as "no legal candidate found within the permitted search". Never report a conflict as impossible unless that has been established.

      - (e) Hinted nodes retain their peer relation during placement and repairs. Reposition, dissolve or recompute automatic clusters as needed to honour the hint; a cluster is not required to move whole when doing so would break an honoured hint. Group membership (7.8) and hard legality remain binding.

      - (f) Legality and routing faults: hints never override legality (section 10); only the marked 5.7 fallback is excepted when no legal route exists. A line hint may expressly permit its named tier-3 routing fault. A node/group placement hint may make a tier-3 routing fault unavoidable, but never permits a legality fault: keep the honoured placement hint, report and score the routing fault under 2.13, and do not drop the hint to hide it. Evaluate feasible alternative routes and placements first. Add space when it can honour the hint (1.7); otherwise report the impossible hint and render the deterministic fallback. A valid line hint that forces a detour is honoured, scored under 2.13 and reported with the detour it causes. No cost threshold drops it.

      - (g) Score: each placement axis honoured on its own scores -30 in rule 2.13, so a node, note or group with two honoured axes scores -60 and one with a single honoured axis -30. Each honoured line hint scores -15 once per connection, however many parts it has. There is no separate alignment score. The score only compares candidates; it never drops an honoured hint. This is intended: the structure of an original is preferred to calculated layout. A hint that cannot be honoured earns nothing, is reported with the reason, and layout continues; nothing fails.

      - (h) Direction: see rule 2.19. A node, group or line without a hint is laid out as before.
  - id: "2.22"
    title: "Notes"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.13","2.15","4.2","4.10","7.8"]
    outranks: []
