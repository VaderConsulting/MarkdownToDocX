    yields: []
    pictures: ["loop-back-markup.png"]
    hint_overridable: false
    order: 96
    blank_before: 1
    text: |-
      A back edge leaves its source's downstream side if that side is free; if not, it leaves the side facing its return track. It enters the middle of the target's side that faces the return track (see loop-back-markup.png).
  - id: "5.4"
    title: "Return track side and order"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: ["4.8"]
    yields: []
    pictures: []
    hint_overridable: false
    order: 97
    blank_before: 1
    text: |-
      Put the return track on the same side of the main path as the back edge's source. If the source is on the main path, use the side with no branches; if that is still tied, use the right side. When several back edges share a side, the longest takes the outermost track.
  - id: "5.5"
    title: "Removed"
    title_in_text: false
    section: "S5"
