    text: |-
      Frames never overlap each other or cross a node that is not a member. Frame clearance is measured on the visual bounds of nodes (term Node geometry). When two frames, or a frame and an outside node, sit in neighbouring columns or ranks, grow that gap by 1 grid step, or by 2 when a line also runs through it (see frame-overlap-markup.png). Frames contain the full visual bounds of expanded members. Make room by growing frames or gaps, never by resizing an unrelated node.
