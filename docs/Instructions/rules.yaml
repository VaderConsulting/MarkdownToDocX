    text: |-
      Allocate ports before routing under 3.2, 3.3 and 4.7, using the relative positions of the two endpoint nodes to determine port order and sides. A connection is a single straight run only when its allocated ports line up and their required departure and arrival directions agree; diamond edge normals are measured against the actual sloped edge (3.1). Always offer the legal straight outline-to-outline route as a candidate, reserving aligned ports before distributing other ports. Straight routing takes priority over symmetric port spacing. If no straight route is legal, compare node or linked-group movement (5.10) and the routes with the fewest legal direction changes from each allocated port (4.8). A legal line hint can override automatic route choice, not hard legality. After any change to a node's spans or position, recalculate its ports, routes, track availability, clearances and crossings, and then the full score (2.13). Preserve exact allocated-port terminal runs and use their drawn geometry for checks under 3.2.
  - id: "4.3"
    title: "Corner limit"
    title_in_text: false
    section: "S4"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: ["max_corners_forward","max_corners_back_edge"]
