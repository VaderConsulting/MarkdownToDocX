    pictures: []
    hint_overridable: false
    order: 84
    blank_before: 1
    text: |-
      A diamond decision branch travels at least 50 px **perpendicular to its sloped edge** before its first change of direction onto the grid. A line entering a diamond likewise follows the edge normal for its required terminal straight run; its length must accommodate the arrowhead and any transition geometry. Other lines have at least 20 px of straight travel after their source port before a corner, and every arrowheaded line has a terminal straight run at least as long as its arrowhead. Do not impose a universal 50 px source run on ordinary lines.
  - id: "4.5"
    title: "Z middle run on a track"
    title_in_text: false
    section: "S4"
    kind: "legality"
