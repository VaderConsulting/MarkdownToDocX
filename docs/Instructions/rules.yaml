rules:
  - id: "1.1"
    title: "Direction mapping"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 37
    blank_before: 1
    text: |-
      For LR, read left for top, right for bottom, top for left and bottom for right. BT and RL mirror TB and LR.
  - id: "1.2"
    title: "One grid"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["grid_step"]
    refs: ["1.3","2.16","2.17","2.18","2.20","2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 38
    blank_before: 1
    text: |-
      In `grid` mode, place every rectangular node on the one shared logical grid (term Grid). A node's placement is its start row, start column, row span and column span, and its position and dimensions follow from that occupied region alone; a node's geometric centre is derived from its drawn shape for drawing and measurement only and never decides placement. The region is one contiguous rectangle of whole cells; spans are positive integers with no maximum, and fractional occupancy is not allowed. No cell belongs to more than one node. A node grows by taking further whole columns or rows, to the right, left, down, up or along both axes, whichever gives the best legal arrangement under the precedence and score; right and down are only the final tie-break. Growing one node never changes the size of another. Move nodes and linked groups only by whole cells. Before moving anything, use free contiguous cells if the node can take them without breaking legality or an honoured hint. Otherwise move the affected neighbours by whole cells, keeping their relative order unless a higher-priority rule or honoured hint requires otherwise, keeping every external clearance, and never resizing them; do not move unaffected nodes. Remove genuinely empty rows or columns without consuming routing clearance or any cell a node occupies. The fine grid remains for outward-rounded frame edges, tracks and gap growth. Ports, curves, labels and arrowheads remain continuous drawing coordinates. Placement is deterministic. In `open` mode, the logical grid and cell spans do not apply.
  - id: "1.3"
    title: "Box size"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["grid_step","diamond_height_factor","base_cell_width","base_cell_height","node_text_padding"]
    refs: ["1.7","2.22","1.2","5.6","5.10","2.11","3.2","2.13","3.7","3.8","4.4"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 39
    blank_before: 1
    text: |-
      Base cells. In `grid` mode the base cell width and height (parameters base_cell_width and base_cell_height) are set before any label is fitted, from the renderer's standard rectangular-node size and measured font metrics. The height holds at least two lines of node text plus vertical padding; the width meets the configured minimum plus horizontal padding. Both may be rounded up to whole grid steps and then stay fixed for the diagram. They are never derived from the longest label, the largest or busiest node, label statistics, the node count or a group's size, and are never enlarged because one node needs more room. Node size. A rectangular node fills its whole occupied region as one continuous shape: its width is its column span times the base cell width plus the internal column gaps it spans, and its height is its row span times the base cell height plus the internal rank gaps it spans, each gap at its current size. Node sizes are measured on visual bounds (term Node geometry). Fitting text. Measure each label with the rendering font, size, line spacing and padding, keep explicit line breaks, break at word boundaries, and split a word only when it cannot fit any candidate width; never clip, truncate, overlap or shrink text. Try 1x1 first, with wrapping. If the label does not fit, generate a finite, deterministic set of candidate spans (for example 2x1, 1x2, 2x2) from measured word widths, line breaks, line heights, padding and the size of whole-cell spans, considering width and height independently; leave out a candidate larger in both directions than another that fits, unless other required geometry needs it. Port capacity on the connection boundary at the minimum separation (3.2), departure and arrival geometry, and other mandatory geometry can raise the minimum span. The number of neighbours alone never makes a node grow. Choose among the legal candidates by the placement rules and score (2.13); no candidate is preferred merely for being wider or larger, and a node is never enlarged only to lower the empty-space score. There is no maximum span and no in-between size. Order. Set base cells, measure labels, choose wrapping and span candidates, add port and shape needs, place nodes, allocate ports, route, then validate and score complete candidates and repair (1.7). When any earlier decision changes, recalculate everything that depends on it; no port or route may use stale sizes. Diamonds. A diamond has the base cell width and twice the base cell height. It may grow by whole grid steps, keeping its proportions, when text, port separation, connection geometry or mandatory clearance requires it, and never just to fill its region. It reserves the smallest whole-cell rectangle that holds its visible shape and is drawn centred in it without filling it. No other node may use those cells, but the empty space between the diamond and its region is not part of the diamond; its connection boundary and obstacle geometry come from its drawn shape. Its departure and arrival clearance (3.7, 3.8, 4.4) is checked against neighbouring obstacle geometry, because reserving its cells does not guarantee it. Notes are sized separately (2.22).
  - id: "1.4"
    title: "Whole grid steps"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["grid_step","corner_radius"]
    refs: []
    outranks: []
    yields: []
    pictures: ["rank-gap-markup-2.png"]
    hint_overridable: false
    order: 40
    blank_before: 1
    text: |-
      Move nodes by whole cells, and grow gaps only in whole grid steps, across the whole rank or column. Never shrink a corner, straight run, label gap or padding to make something fit (see rank-gap-markup-2.png). Adding a column to a node's span adds one base cell width plus the column gap it spans; adding a row adds one base cell height plus the rank gap. Growing a gap by fine grid steps is a separate operation and never changes a span.
  - id: "1.5"
    title: "Equal rank gaps"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["base_rank_gap","grid_step","track_spacing"]
    refs: []
    outranks: []
    yields: []
    pictures: ["rank-gap-markup.png"]
    hint_overridable: false
    order: 41
    blank_before: 1
    text: |-
      Make every rank gap equal to the base rank gap of 2 grid steps. This value provides a default corridor for rounded corners, arrowhead clearance and independently allocated tracks; it is not intended to satisfy the longer diamond straight-run minimum. A rank gap grows only to hold a label, a Z, extra tracks, required run/corner clearance or a frame, and that growth changes no other gap (see rank-gap-markup.png). These are external gaps between separate nodes; a gap inside a node's occupied region is part of that node (term Grid) and is not counted as clearance.
  - id: "1.6"
    title: "Snap to grid"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["grid_step"]
    refs: []
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 42
    blank_before: 1
    text: |-
      Snap Mermaid's positions to the logical grid one whole rank or column at a time, giving each node a whole-cell occupied region (1.2). If two regions would share a cell, move the second node on by whole cells in rank order, and repeat until no cell is shared. Snapping and collision checks use each node's full occupied region, not a single point.
  - id: "1.7"
    title: "Always move forward (insert space)"
    title_in_text: false
    section: "S1"
    kind: "legality"
    stage: "G1"
    status: "active"
    pointer: ""
    params: ["grid_step","track_shortage_growth","track_spacing","frame_gap_growth","initial_gap_track_headroom_percent"]
    refs: ["5.7","1.3","2.13","2.14","9.5"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 43
    blank_before: 1
    text: |-
      During initial band placement, size each routing gap from the forecast lines passing through it plus initial_gap_track_headroom_percent percent. Round the reserved track count up and reserve at least one extra track for a gap with forecast traffic. Use the existing track spacing, keeping band membership, band order and column order fixed; this initial sizing does not change any repair limit. Repair geometric shortfalls monotonically. First measure the actual shortfall: missing label room calls for wrapping or a larger span (1.3); missing port capacity for a larger span or legal port reassignment; missing track capacity for routing space in a gap; an occupancy conflict for moving nodes by whole cells; missing group room for a larger frame. There is no fixed order among these repairs. Build the complete legal candidates that address the shortfall, and keep the one with the lowest score (2.13), using the existing tie-breaks (9.5) and then a deterministic final choice. When growing an external gap and growing an internal gap would both meet the need legally, grow the external gap; a grown internal gap enlarges every node that spans it and adds no routing corridor there. Every repair keeps whole-cell occupancy, non-overlap, external clearance, honoured hints, group membership, mandatory routing geometry and the main-path movement limits. Accept a repair only when it strictly reduces the measured shortfall or meets the strictly improving candidate rule (2.14); never retry an unchanged state or grow without limit. After a gap changes, update cell positions, sizes of nodes spanning it, visual and obstacle geometry, frames, ports, routes, legality and score. A shortfall caused by a port away from the middle of its edge and insufficient corner clearance is repaired by moving the unhinted child to a different column, not by growing the rank gap. Clearances, spacing and inserted space are measured on visual bounds (term Node geometry). If no legal repair exists, draw the visibly marked fallback of rule 5.7 and issue a diagnostic; never omit the diagram.
  - id: "2.1"
    title: "Start from Mermaid"
    title_in_text: false
    section: "S2"
    kind: "quality"
