  - id: "5.6"
    title: "Joint reassignment before accepting"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "X1"
    status: "active"
    pointer: ""
    params: []
    refs: ["4.3","5.10","1.3"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 99
    blank_before: 1
    text: |-
      Reconsider affected ports, tracks, sides and unhinted node positions together to remove avoidable crossings and humps. Additional corners are allowed within 4.3 unless an applicable hint permits more. Do not move a main-path node sideways during coupled repair; only a wrap fold or honoured hint can change its columns. Recompute all affected routes, apply legality, then hints, then non-exempt routing faults, then score. Remaining unavoidable crossings must be right-angled and inside gaps. Growing an unhinted node by whole cells is a candidate repair for a measured port-capacity or routing shortfall, within 4.3 and the 5.10 limits.
  - id: "5.7"
    title: "Insert space until legal"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["1.7","2.24"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 100
    blank_before: 1
    text: |-
      Every input produces a diagram and diagnostics, even when requested geometry cannot be satisfied. For each repair, measure the outstanding geometric shortfall and accept only a change that strictly reduces it; use whole-step gap growth or whole-column child movement as appropriate (1.7). Port assignment and route validation happen in the layout and routing model. The painter draws only model-supplied routes; it never invents a straight centre-to-centre line for a link with no route. A missing route is an error and must be reported. For non-geometric impossibility, stop retrying and draw a deterministic fallback: retain all nodes and group frames without overlap, preserve group membership, draw every original relationship as an explicitly marked fallback connector using the shortest obstacle-avoiding orthogonal path available, and label the affected connectors as routing fallbacks in the diagnostics. A fallback connector may violate normal corner limits or routing preferences, but must not pass through nodes, hide an endpoint or change semantics. If even an obstacle-avoiding connector cannot be constructed, draw a visible dashed unresolved-connection stub at each endpoint and report the pair; never silently drop an edge or the diagram. This rule applies to input that has been read and validated without errors; a syntax or semantic error fails the diagram before layout (2.24).
  - id: "5.10"
    title: "Move before detour"
    title_in_text: true
    section: "S5"
    kind: "quality"
    stage: "X1"
    status: "active"
    pointer: ""
    params: ["score_bend","score_repair_length_per_grid_step","score_repair_moved_line","repair_candidate_moves","repair_chain_depth","repair_chain_lines","repair_chain_lines_fan_hub","repair_extra_length_px","repair_extra_bends"]
    refs: ["1.2","1.7","2.13","2.21","4.2","5.7","5.8","5.9","1.3"]
    outranks: ["4.2","5.8","5.9"]
    yields: ["2.21"]
    pictures: []
    hint_overridable: false
    order: 101
    blank_before: 1
    text: |-
      Move before detour. For every bent or detoured route, compare the legal options: move an unhinted endpoint or linked group by one or more whole cells, reroute either clashing line, or retain the current legal route. Include moves that straighten several relationships together, and compact empty rows and columns left by an accepted move. Reroutes may chain when one reroute creates another clash; score the whole chain as one option. Choose the option with the lowest overall repair score, counting added route length (5.10 length weight), each bend (2.13) and every line that must be rerouted (5.10 line weight). A move must obey hints (hints win), preserve the grid and group membership, add no legality or routing fault, and lower the score. For an atomic candidate that moves a fan hub and reroutes every declared line in that fan together, repair_chain_lines_fan_hub is the number of lines in that fan. Moving the hub necessarily changes every fan terminal, so the complete fan must be scored and restored as one assignment rather than truncated at the ordinary twelve-line bound. Every other candidate still uses repair_chain_lines (12). This exception permits no unrelated changed lines and does not raise the candidate-move, chain-depth, added-length or added-bend limits. Route options obey named limits for candidate moves, chain depth, lines per chain, added length and added bends; those values protect the 10 second per-diagram target and are set from catalogue measurements. If no move qualifies, route around it as normal. Report when a named limit prevents further candidates from being examined. Growing an endpoint by whole cells (1.3) is also a legal option where it resolves a measured port or routing problem; it counts against the same candidate limits.
      In the final repair pass only, after placement, fan nesting, routing and every other repair are complete, a candidate may introduce a new finding identity when the complete candidate, fully rerouted and re-checked, lowers the layout score, adds no legality, hard-gate or routing fault, adds no bends or crossings in that scenario, and does not raise that scenario's total finding count. Every earlier pass keeps the rule that no finding identity may increase.
  - id: "5.8"
    title: "Fans between columns"
    title_in_text: true
    section: "S5"
    kind: "routing-fault"
    stage: "R3"
    status: "active"
    pointer: ""
    params: []
    refs: ["1.7","2.10","2.21","3.2","3.3","5.2"]
    outranks: []
    yields: ["2.21"]
    pictures: ["pictures/markup-fan-out-bad.png"]
    hint_overridable: true
    order: 102
    blank_before: 1
    text: |-
      Fans between columns. When lines fan out from one source to targets that lie wholly beyond its left or right side, or fan in to one target from such sources, each line leaves the side of the source that faces the target and enters the side of the target that faces the source, at spread ports (rules 3.2 and 3.3). Each line has its own track in the gap between the columns, and the tracks are nested as rule 5.2 sets so that the lines do not cross each other. When a fan's lines cannot all nest on the hub's facing side without crossing, lines to leaves beyond the hub's top edge may use its top side and lines to leaves beyond its bottom edge may use its bottom side. Each side group is nested as rule 5.2 sets, so no two lines of the fan cross. This applies to fan-in and fan-out and takes precedence over 4.11 for these fan lines. The far side, box corners and shared tracks remain forbidden. A line hint (rule 2.21) may name the side within hard legality. Fans to the next rank use the bottom and top sides (rules 2.10 and 5.2). Insert space for the tracks as rule 1.7 sets (see pictures/markup-fan-out-bad.png, which shows what is forbidden).
  - id: "5.9"
    title: "Avoidable crossings"
    title_in_text: false
    section: "S5"
    kind: "routing-fault"
    stage: "R5"
    status: "active"
    pointer: ""
    params: ["score_crossing"]
    refs: ["2.13","4.3"]
    outranks: []
    yields: ["2.21","4.3"]
    pictures: ["pictures/markup-fan-out-bad.png"]
    hint_overridable: true
    order: 103
    blank_before: 1
    text: |-
      Avoidable crossings are **routing faults, not score terms**. If a legal alternative assignment of tracks, ports, sides or permitted extra corners removes a crossing while preserving hints and sections 3–5 (including 4.3), reject the crossing route and use the alternative. Evaluate affected lines together. A crossing with no such alternative remains as a right-angle crossing inside a gap and is reported/scored under 2.13. No hops.
  - id: "6.1"
    title: "Label on a straight run"
    title_in_text: false
    section: "S6"
    kind: "legality"
    stage: "L1"
    status: "active"
    pointer: ""
