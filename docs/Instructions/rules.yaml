    text: |-
      Decision branches. Allocate each branch a distinct port on a suitable diamond edge using 3.2, 3.3 and 4.7, preferring the edge facing its target subject to hints and legality. Each branch departs perpendicular to its sloped edge, runs straight for at least 50 px, then turns onto horizontal or vertical routing (3.1, 4.1, 4.4). Grow the diamond and surrounding gaps by whole grid steps to reduce measured port-spacing or initial-run shortfalls (1.7). Routes are independent and never share a port or first run.
