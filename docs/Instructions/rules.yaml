    blank_before: 1
    text: |-
      Notes. A note is a free-text dog-ear box, not an Enterprise element or semantic relationship endpoint. Notes may be grouped or top-level, are sized independently from their text; in `grid` mode each note is placed in the smallest whole-cell region that holds its visual bounds, reserves that region, and follows the clearance rules. A connected note sits beside its connected node or group on the same row in the nearest free cell unless an honoured hint moves it; an unconnected note follows 2.15. Group membership and frame containment follow 7.8. Plain note connections have no arrowhead or semantic relationship meaning (4.10); their routes follow 4.2 like every other connection, and they **do not count in the forced-crossing minimum** under 2.13. A line label is not a note.
  - id: "2.23"
    title: "Enterprise layers"
    title_in_text: true
    section: "S2"
    kind: "quality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.13","2.19","2.21","7.8"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 67
    blank_before: 1
    text: |-
      Enterprise layers. In enterprise diagrams whose elements come from more than one layer, place the layers as horizontal bands. From top to bottom they are Motivation, Strategy, Business, Application, Technology and Physical (one band), then Implementation and Migration. An element's layer comes from its Enterprise type.

      A junction belongs to no layer and sits next to the elements it joins. A location drawn as a node belongs to no layer and sits next to the elements it relates to most. A location drawn as a container is treated like a grouping.

      A grouping belongs to no layer and has no position of its own. Its frame is drawn around its members wherever their bands place them. If the members are in more than one band, the frame spans those bands as one solid block, each member stays in its own band, and elements that aren't members are kept out of the frame, even if a band has to wrap.

      The bands follow the page. The declared flow direction applies only within a band. Within a band, passive structure goes on the left, behaviour in the middle and active structure on the right. This order applies separately inside each grouping frame's part of the band and among the band's ungrouped elements. Columns are never aligned across different frames, and keeping a frame as one solid block takes priority over the aspect order. A band may wrap onto further rows to approach the overall shape target.

      In the Implementation and Migration band, plateaus run from left to right in triggering order, and each gap sits between the plateaus it relates.

      A diagram whose elements all come from one layer has no bands.

      The band order, band membership and the plateau order are conventions, not preferences. A hint can't put an element in another band, can't move a band above or below a band of a different layer type and can't reorder plateaus. Such a hint is dropped and reported under 2.21(c), with no score under 2.21(g). When a declaration has hints on both axes and only one breaks a band rule, only that hint is dropped. A hint can still change an element's position within its own band, the order within the Technology and Physical band, how a band wraps, and where junctions, locations and frames go, as long as every member stays in its own band. Band membership and band order are binding: hints can't override them, and the engine enforces them as a veto.
  - id: "2.24"
    title: "Diagnostics and error policy"
    title_in_text: true
    section: "S2"
    kind: "legality"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["5.7"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 68
    blank_before: 1
    text: |-
      Diagnostics and error policy. A source that cannot be read as valid statements, or that breaks the model (unknown element type, an invalid relationship type, qualifier or rules-table cell, an unresolved endpoint or container, an unsupported Mermaid arrow or shape, an unclosed block, malformed hint syntax or a duplicate clause), is an error, and the diagram is not drawn. A hint that is read correctly but cannot be honoured, and an invalid or conflicting part of a line hint, is a warning: drop only that hint, axis or part, report it with its reason, and draw the diagram normally. A placement axis dropped by the repair process is reported as "conflicting constraints" only when the conflict is established, and otherwise as "no legal candidate found within the permitted search". A redeclaration that materially changes the effective placement hint is a warning, and an identical one is not. Every diagnostic names the line, the construct and, where one exists, the accepted form. Rule 5.7 applies only to input for which this rule reports no error.
  - id: "3.1"
    title: "One port per line"
    title_in_text: false
    section: "S3"
    kind: "legality"
    stage: "R2"
    status: "active"
    pointer: ""
    params: []
    refs: ["3.2","3.3","4.1","4.4","4.7"]
    outranks: []
    yields: []
    pictures: ["f11-straight-markup.png"]
    hint_overridable: false
    order: 70
    blank_before: 1
    text: |-
      Each line has its own distinct port and non-overlapping first run. A line ends exactly at its allocated port on the node's connection boundary (term Node geometry) and meets that boundary there at a right angle: perpendicular to a rectangular edge or perpendicular to a sloped diamond edge. This requirement applies to diamonds under this rule; a diamond's initial or final edge-normal run is the sole permitted non-horizontal/non-vertical straight run, then turns onto the orthogonal grid after its required minimum length (4.1, 4.4). Diamond ports are allocated symmetrically by 3.2, 3.3 and 4.7. Port assignment and route legality are checked in the layout and routing model, not by an SVG checker. The painter draws only the route supplied by that model; a missing route is reported as an error and is never replaced by a straight centre-to-centre line. Ports are allocated on the node's final connection boundary after its spans are set, never on a one-cell outline that is then stretched.
  - id: "3.2"
    title: "Symmetric port allocation"
    title_in_text: false
    section: "S3"
    kind: "legality"
    stage: "R2"
    status: "active"
    pointer: ""
    params: ["grid_step"]
    refs: ["1.3","1.7","2.21","3.3","5.1","5.6","5.10"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 71
    blank_before: 1
    text: |-
      Allocate lines jointly on each eligible edge of the connection boundary (term Node geometry), such as a rectangular side or a diamond edge. For n lines on an edge, use positions k/(n+1), k=1..n, along that edge; one line uses the edge centre. Symmetry is a quality preference. Preserve target order (3.3). Port coordinates may be fractional and are not grid-placement coordinates. A legal straight connection takes priority over symmetry: reserve the connection-boundary port aligned to its neighbour, even when n is even. Distribute the remaining distinct ports in the free intervals, preserving endpoint order and minimum clearance. Use symmetric k/(n+1) slots when no straight alignment is available. For rectangular nodes, insufficient spacing calls for a larger span (1.3) or legal port reassignment (1.7). For a diamond, insufficient port spacing or first-run clearance grows that diamond by whole grid steps (1.7). Hinted side choices participate in joint allocation. Edges need not have equal lengths; a spanning node's longer edges hold proportionally more ports at the same minimum separation. Distinguish four cases: too little port capacity on an edge, which may require growth under 1.3; too few tracks in a gap, which grows the gap (5.1); a legal route that only needs more bends, which needs no growth; and an optional quality improvement, which may use growth only under 5.6 or 5.10. A legal asymmetric allocation is never rejected for being asymmetric, and there is no symmetry score. A line leaves and joins a node at its exact allocated port position, at right angles to the side, and keeps that coordinate until its first bend. Tracks in the adjacent gap are placed at the coordinates of the ports they serve, not on a fixed grid line. Crossing, shared-track and clearance checks use this drawn geometry.
  - id: "3.3"
    title: "Port order"
