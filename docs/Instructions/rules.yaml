    blank_before: 1
    text: |-
      Centre each label on a straight run of its own line, on a white background, with the line broken round it and one label gap on each side (see edge-label-markup.png). The line keeps its own course through the label: it is never bent, jogged or moved sideways to make room for a label, and a label never sits on a corner. If no straight run is long enough, insert space as rules 1.7 and 6.2 set (label room is legality) (see pictures/markup-decision-branches.png, pictures/markup-three-way-decision.png). A connection label may wrap onto several lines, keeping explicit line breaks; the wrapped label is one rectangle, including padding, and every collision check uses that whole rectangle. It sits on one straight run, clear of corners, and the line stays collinear before and after it. Wrapping a label never bends, jogs or re-tracks the line or creates an S-curve.
  - id: "6.2"
    title: "Label run choice"
    title_in_text: false
