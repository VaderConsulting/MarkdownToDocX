    outranks: []
    yields: ["2.21"]
    pictures: []
    hint_overridable: true
    order: 83
    blank_before: 1
    text: |-
      A line has at most 2 corners, 3 for a back edge; insert space until met (rule 5.7). A line with a hint (rule 2.21) may use the corners its hint needs. A line never loops on itself, and never runs past the side of its target that faces the source and turns back.
  - id: "4.4"
    title: "Minimum straight run at ends"
    title_in_text: false
    section: "S4"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: ["corner_radius","min_straight_run","diamond_min_straight_run"]
    refs: []
    outranks: []
