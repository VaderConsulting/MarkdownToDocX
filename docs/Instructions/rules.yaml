    refs: []
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 114
    blank_before: 1
    text: |-
      Keep at least one grid step between a frame outline and every member node on all four sides, below the title band. Grow the frame or its surrounding gap in whole grid steps; never move a member out of its whole-cell region. Insets are measured from the member's full occupied region.
  - id: "7.7"
    title: "Centre group members"
    title_in_text: false
    section: "S7"
    kind: "legality"
    stage: "P5"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.21"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: true
    order: 115
    blank_before: 1
    text: |-
      Centre a group's member layout within its frame horizontally and vertically when the group has no placement hint. An honoured hint (rule 2.21) determines the placement and takes precedence.
  - id: "7.8"
    title: "Frame membership"
    title_in_text: true
    section: "S7"
    kind: "legality"
    stage: "L1"
    status: "active"
    pointer: ""
    params: ["grid_step","frame_padding","group_member_min_inset"]
    refs: ["2.11","5.6"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 116
    blank_before: 1
    text: |-
      Frame membership. A member that conflicts with its frame grows the frame and is never moved out. A non-member that conflicts with a frame is placed outside it once, and no later step, including 2.11 and 5.6, moves it back inside. A member that grows grows its frame; it is never moved out to make room.
  - id: "8.1"
    title: "Sequence notes"
    title_in_text: false
    section: "S8"
    kind: "legality"
    stage: "L1"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: []
    yields: []
    pictures: ["sequence-note-markup.png"]
    hint_overridable: false
    order: 118
    blank_before: 1
    text: |-
      Leave the same clear space above and below a note as between two consecutive messages. A note never touches a message line, an arrowhead or a label. Set this in the shared row layout, never for one diagram (see sequence-note-markup.png).
  - id: "9.1"
    title: "Legality first"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["5.9"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 120
    blank_before: 1
    text: |-
      Apply precedence in this order: (1) hard legality (section 10); (2) honoured hints, subject only to hard legality; (3) routing-fault rejection unless an applicable line hint explicitly permits the fault; (4) score-based optimisation. Mandatory structural constraints are applied during candidate construction; automatic placement preferences yield to hints. Avoidable crossings are routing faults under 5.9, not a score trade-off. Insert space only for legality or to honour hints. Valid cell occupancy is hard legality and beats every visual preference; no preference for equal node sizes may block growth that legality needs, and no optimisation may allow fractional occupancy or overlap.
  - id: "9.2"
    title: "Grow space before breaking legality"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.17","5.7"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 121
    blank_before: 1
    text: |-
      Grow space only to reduce a measured legality or hint-clearance shortfall. If a port offset leaves insufficient horizontal room for corners, move the unhinted child by whole columns (2.17); growing a vertical gap does not fix that defect. When normal geometry is unsatisfiable, use the visible diagnostic fallback (5.7), not an unbounded retry or omitted diagram.
  - id: "9.3"
    title: "Specific beats general"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["3.1","3.2","3.3","3.6","3.7","3.8","3.9","4.4","4.7","5.3","5.4","9.6"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 122
    blank_before: 1
    text: |-
      A specific rule beats a general automatic rule within one step of 9.6: diamond-specific first-run and sizing rules (3.6–3.9, 4.4) supplement the shared port rules (3.1–3.3, 4.7), while back-edge rules (5.3–5.4) supplement forward-line rules. Hints override all automatic rules except hard legality.
  - id: "9.4"
    title: "Tie-break order"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.13","9.1"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 123
    blank_before: 1
    text: |-
      Evaluate each candidate in the order of 9.1: hard legality, honoured hints, non-exempt routing faults, then complete score (2.13). Specific geometric rules take precedence over general automatic rules, but never over an honoured legal hint. Automatic ties prefer grid placement, main-path continuity, fewer crossings, fewer corners, label placement, then Mermaid source order.
  - id: "9.5"
    title: "Mermaid order on tie"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: []
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 124
    blank_before: 1
    text: |-
      If a choice is still tied, keep Mermaid's order.
  - id: "9.6"
    title: "Precedence"
    title_in_text: false
    section: "S9"
    kind: "structure/pointer"
    stage: "V1"
    status: "active"
    pointer: ""
    params: []
    refs: ["5.7","5.10"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 125
    blank_before: 1
    text: |-
      Execution order. Parse and validate hints; determine direction, main path, decisions, fan/block placement, clusters and disconnected pieces. Apply hints as constraints throughout, ahead of automatic placement. Allocate ports jointly, route decision branches, convergence, fans and back edges, then minimise corners. Check hard legality, honour legal hints, reject non-exempt routing faults and only then score candidates. Apply compaction and wrapping. For each routing fault, apply the bounded move-before-detour repair (5.10) before changing the route; then run coupled repairs and reroute all affected lines. Coupled repairs never move main-path nodes sideways except at an explicit wrap fold or by hint. Repair only measurable shortfalls; if unresolved, render the fallback and diagnostics (5.7). Direction trials select among completed candidates; Mermaid order resolves ties.
entries:
  - id: "pre.layout.1"
    kind: "preamble"
    section: "layout-setting"
    refs: []
    pictures: []
    order: 4
    blank_before: 1
    text: |-
      Enterprise and flowchart diagrams default to `grid`. Diagram frontmatter may set `config.layout` to `grid` or `open`. An unknown value gives one warning and uses `grid`. The command-line option `--layout grid|open` sets the run default; the diagram's own setting takes precedence.
  - id: "pre.layout.2"
    kind: "preamble"
    section: "layout-setting"
    refs: ["2.11"]
    pictures: []
    order: 5
    blank_before: 1
    text: |-
      `grid` uses the shared grid and placement rules below. `grid` includes the compaction step in rule 2.11. `open` skips shared-grid placement and permits free node and group positions. Both modes use the same routing, ports, straight runs, rounded corners and crossing rules. Boxes and unrelated group frames must not overlap in either mode.
  - id: "pre.legend.1"
    kind: "preamble"
    section: "legend-setting"
    refs: []
    pictures: []
    order: 7
    blank_before: 1
    text: |-
      Diagram frontmatter may set `config.legend` to `off`, `on`, `bottom-right`, `bottom-left`, `top-right`, `top-left`, `below`, `right`, `table`, or a placement hint such as `right-of id`. It defaults to `off`; `on` means `bottom-right`. The command-line option `--legend` sets the run default and diagram frontmatter wins. An image legend is placed after the main layout and never changes its nodes, routes, labels or score. It contains only the distinct visible node and line types used by the diagram, in first-use order; invisible connectors are omitted. It sits outside the main bounds with one grid step of clearance. `table` draws no image legend and adds a two-column Symbol/Type table after the diagram. Main-layout legality and quality checks exclude legend samples; the legend may not overlap itself or the main diagram.
  - id: "pre.decisions.1"
    kind: "preamble"
    section: "legend-setting"
    refs: ["3.8","4.8","4.11"]
    pictures: []
    order: 8
    blank_before: 1
    text: |-
      > **Consolidated decisions (14 Oct 2026).** The operative rules below incorporate these decisions; this note is a history summary, not a separate precedence layer.

      > 1. Offset child in the next rank: use one corner into the target, entering as rule 4.11 sets, as rule 4.8 says.

      > 2. Diamond branches require 50 px before the first corner. Other source runs require at least the 20 px corner radius; terminal runs require at least the arrowhead length. A base rank gap remains 2 grid steps.

      > 3. A gap grows by a whole grid step when it runs out of tracks.

      > 4. A node that rejoins the main path stays on the main path.

      > 5. Ties: branches go left of the main path, return tracks go right, diamond branches use symmetric edge ports, label clearance is the width of "n", and frame padding is 1 grid step.

      > 6. The "Arrangement kept" check of brief section 9 allows the reordering in section 2 of this rulebook.
  - id: "pre.generic.1"
    kind: "preamble"
    section: "legend-setting"
    refs: ["1.1","2.4","2.20","2.21"]
    pictures: []
    order: 35
    blank_before: 1
    text: |-
      Every rule is generic: it uses structure and geometry, never labels, samples, tests or group titles; only hints identify peers by id (2.21). **Precedence has four distinct levels:** (1) hard legality, including geometry and section 10; (2) honoured hints, which override automatic placement and eligible routing faults; (3) routing-fault rejection for routes not explicitly permitted by hints; (4) scored optimisation. A hint cannot override hard legality, but can override automatic placement, cluster membership preferences and eligible routing faults. Rules are expressed for top-to-bottom (TB); rule 1.1 maps them to other directions. `webshop-target-rules.md` retains historical pictures and decisions.
  - id: "legality.1"
    kind: "legality"
    section: "S10"
    refs: ["1.5"]
    pictures: []
    order: 127
    blank_before: 1
    text: |-
      - In `grid` mode, a node whose occupied region is not one contiguous rectangle of whole cells, a fractional or zero span, two nodes occupying the same cell, a frame edge off the fine grid, a node move that is not a whole number of cells, or gap growth that is not a whole number of grid steps. Also forbidden: a node whose region skips a cell or consists of separate cells; a spanning node whose rendered rectangle leaves out a gap inside its region; growth that reduces the gap to another node below its minimum; a node using cells reserved by a diamond; and drawing or treating a spanning node as several nodes. Fractional **rendered** port, curve, text and arrowhead coordinates are permitted. In `open` mode, grid-alignment constraints do not apply. Two nodes overlapping, or unequal rank gaps not justified by rule 1.5, are forbidden in either mode.
  - id: "legality.2"
    kind: "legality"
    section: "S10"
    refs: ["4.3"]
    pictures: []
    order: 128
    blank_before: 1
    text: |-
      - A diagonal run **except the single edge-normal initial/final straight run at a sloped diamond edge** (3.1, 4.1), a curve other than an allowed 20 px orthogonal corner or diamond-to-grid direction change, an S-curve, a hop arc, or more corners than 4.3 permits (except a hinted line or a marked fallback connector under 5.7).
  - id: "legality.3"
    kind: "legality"
    section: "S10"
    refs: ["2.21"]
    pictures: []
    order: 129
    blank_before: 1
    text: |-
      - A line whose allocated ports align but is drawn as anything other than one straight run (unless a legal line hint overrides its route), or a source/terminal run shorter than the applicable minimum in rule 4.4.
  - id: "legality.4"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 130
    blank_before: 1
    text: |-
      - A connection that does not end exactly at its allocated port on the node's connection boundary, which is shape-specific and may differ from the visible outline (term Node geometry): a line end short of the port, extending into the node's occupied geometry, attached to an ineligible decorative feature, or on a box corner.
  - id: "legality.5"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 131
    blank_before: 1
    text: |-
      - Two lines sharing a port, first run or overlapping track.
  - id: "legality.6"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 132
    blank_before: 1
    text: |-
      - A line intersecting the obstacle geometry of a node it does not connect to, or through a label it does not connect to, or running along a connection boundary, visible node outline or frame edge.
  - id: "legality.7"
    kind: "legality"
    section: "S10"
    refs: ["2.13","5.9"]
    pictures: []
    order: 133
    blank_before: 1
    text: |-
      - A line crossing a frame other than square-on, or a crossing of two orthogonal line runs other than at a right angle within a gap. Avoidable crossings are governed separately by the routing-faults list and rule 5.9.
  - id: "legality.8"
    kind: "legality"
    section: "S10"
    refs: ["3.8"]
    pictures: []
    order: 134
    blank_before: 1
    text: |-
      - A line running past the target’s facing side and turning back, or a diamond line crossing its own diamond interior. Diamond branches may leave from any allocated edge port.
  - id: "legality.9"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 135
    blank_before: 1
    text: |-
      - Frames overlapping, a frame crossing a non-member node, a member placed outside its owning frame, or a title strip covered or cut short.
  - id: "legality.10"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 136
    blank_before: 1
    text: |-
      - A label touching a line, arrowhead, corner, outline, frame or another label, measured on its whole wrapped rectangle; node or connection label text that is clipped, truncated, shrunk or overlapping.
  - id: "legality.11"
    kind: "legality"
    section: "S10"
    refs: []
    pictures: []
    order: 137
    blank_before: 1
    text: |-
      - A sequence note touching a message line, arrowhead or label.
  - id: "routing-faults.1"
    kind: "routing-fault"
    section: "routing-faults"
    refs: ["4.3","4.11","5.8","5.9","6.1"]
    pictures: []
    order: 139
    blank_before: 1
    text: |-
      - A line bent, jogged or displaced solely for a label (6.1); a convergence line travelling along the gap above its target or S-jogging into its top (4.11); a fan line using the far side or going around its source, or sharing an overlapping track (5.8); any crossing removable by a legal reassignment or permitted extra corner (5.9). Reject these unless an applicable hint permits the fault under 2.21. The section 10 hard constraints still apply to normal connectors.
  - id: "on-hold.1"
    kind: "on-hold"
    section: "on-hold"
    refs: []
    pictures: ["adjacent-groups-markup.png"]
    order: 141
    blank_before: 1
    text: |-
      - Drawing a frame on the centre line of the gap between its members and outside nodes, and reserving that centre line as a frame track that no line may use. Both break when two groups sit side by side (see adjacent-groups-markup.png).
  - id: "resolved.1"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["3.8"]
    pictures: []
    order: 143
    blank_before: 1
    text: |-
      1\. Diamond ports: Diamonds have four edges, each accepting any number of symmetric k/(n+1) ports; one line on an edge uses its centre. Every line meets the sloped outline square to its edge and follows the edge normal for the minimum straight run before turning onto the horizontal/vertical grid (3.1, 3.6–3.9, 4.1). Diamonds grow by whole grid steps when necessary (1.7). No limit applies to outgoing branches.
  - id: "resolved.2"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["3.4","4.8"]
    pictures: []
    order: 144
    blank_before: 1
    text: |-
      2\. Elbow or Z: B3 and brief section 8 took an elbow first; B14, A14 and A16 took a Z first. Superseded by rule 4.8: fewest corners, a Z only when no one-corner route is clear (3.4 removed).
  - id: "resolved.3"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["3.5","4.8"]
    pictures: []
    order: 145
    blank_before: 1
    text: |-
      3\. Side exits: B5, B11 and A14 disagreed on side exits. Superseded by rule 4.8: a line uses the side that faces the other end when that end lies wholly beyond it (3.5 removed).
  - id: "resolved.4"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["4.3"]
    pictures: []
    order: 146
    blank_before: 1
    text: |-
      4\. Corner limit: B3 set 2 corners for every line, but the back edges in B17 and A13 need 3. Forward lines have 2 and back edges 3 (4.3).
  - id: "resolved.5"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["2.1","9.4"]
    pictures: []
    order: 147
    blank_before: 1
    text: |-
      5\. Rearranging: A1 and brief sections 1 and 9 keep Mermaid's rank and order; A5, A12, A13, A14 and A16 change them. The later rules win, and Mermaid's arrangement is the starting point and the last tie-break (2.1, 9.4).
  - id: "resolved.6"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: []
    pictures: []
    order: 148
    blank_before: 1
    text: |-
      6\. Sides and paths: brief sections 6 and 8 follow Mermaid's sides and paths; the rules here replace them.
  - id: "resolved.7"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["2.13","5.6","5.9"]
    pictures: []
    order: 149
    blank_before: 1
    text: |-
      7\. Crossings: B8 banned all crossings; A14, A16 and brief section 8 allow one when nothing removes it. Kept the later rule: a swap that removes a crossing is used (5.6, 5.9); the rest are scored (2.13).
  - id: "resolved.8"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: []
    pictures: []
    order: 150
    blank_before: 1
    text: |-
      8\. Track spacing: brief sections 3 and 7 set 5 tracks 6 px apart; the later A16 sets 1 grid step. Kept A16.
  - id: "resolved.9"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["3.2"]
    pictures: []
    order: 151
    blank_before: 1
    text: |-
      9\. Straight-line port: two lines on one side are spaced k/(n+1), and a single line keeps the centre port so it stays straight. Kept B6 (3.2).
  - id: "resolved.10"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["2.7","2.18"]
    pictures: []
    order: 152
    blank_before: 1
    text: |-
      10\. Spine versus a loop branch: A12 keeps the spine in one column; the later A13 puts a loop child and the spine child on either side. The spine child stays under the diamond and the loop child goes beside it (2.7, 2.18).
  - id: "resolved.11"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["2.6"]
    pictures: []
    order: 153
    blank_before: 1
    text: |-
      11\. A bypass that rejoins: A9 moved the rejoin node up beside the detour; the later A12 keeps it on the spine. Kept A12 (2.6).
  - id: "resolved.12"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: ["5.3","6.2"]
    pictures: []
    order: 154
    blank_before: 1
    text: |-
      12\. Back-edge sides and labels: B15 and B17 described the entry side differently, and B12b and B15 placed labels differently. Replaced by one rule each (5.3, 6.2).
  - id: "resolved.13"
    kind: "resolved-conflict"
    section: "resolved-conflicts"
    refs: []
    pictures: []
    order: 155
    blank_before: 1
    text: |-
      13\. Rank gap: brief section 3 sets a 1-step gap. The base rank gap is now 2 grid steps to provide a routing corridor for rounded corners, arrowhead clearance and separate tracks, rather than to impose a universal 50 px source run.

