    outranks: []
    yields: ["2.21"]
    pictures: []
    hint_overridable: true
    order: 87
    blank_before: 1
    text: |-
      Allocate all automatic lines on each eligible connection-boundary segment (term Node geometry), such as a rectangular side or a diamond edge, together at symmetric k/(n+1) ports (3.2), then assign ports in the order of the other endpoints (3.3). Reserve ports for legal straight connections first, including a centre port when the count is even. Symmetric slots apply to the remaining free intervals. A legal side hint fixes the chosen side but does not exempt its line from joint port allocation. Reassign affected ports and reroute affected lines together to eliminate avoidable crossings (5.9), preserving hints, endpoint order and distinct connection-boundary ports. Straight alignment takes priority over symmetry. Allocate on the expanded connection boundary after spans are set (3.1). Preserve exact allocated-port terminal runs and use their drawn geometry for checks under 3.2.
  - id: "4.8"
    title: "Fewest corners"
    title_in_text: false
    section: "S4"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: []
    refs: ["3.8","4.11","5.3","5.4","4.2"]
    outranks: []
    yields: ["2.21"]
    pictures: []
    hint_overridable: true
    order: 88
    blank_before: 1
    text: |-
      Prefer the fewest legal corners after port allocation: zero only for aligned ports, otherwise one if clear, then a two-corner Z when necessary. Prefer sides facing the opposite endpoint where the endpoint lies wholly beyond that side; break equal-corner ties in flow direction. Rule 4.11 is the specific convergence exception; 3.8 controls decision branches; 5.3–5.4 control back edges. A line hint may override automatic side and route preferences within hard legality. Do not run through boxes or turn back past the facing side of the target. Corner counts are recalculated after any growth or move (4.2).
  - id: "4.9"
    title: "Group endpoints"
    title_in_text: true
    section: "S4"
    kind: "legality"
    stage: "R2"
    status: "active"
    pointer: ""
    params: []
    refs: ["1.7","2.13","2.21","3.1","3.2","3.3","4.2","4.4","4.7","4.8","5.1","5.6"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 89
    blank_before: 1
    text: |-
      Group endpoints. A relationship may name a group as its source or its target. The endpoint is the group's frame. A frame defines its own connection boundary, normally its frame edges, and the frame is treated as a box in rules 3.1 to 3.3, 4.2, 4.4, 4.7, 4.8, 5.1 to 5.6 and 2.13, and in line hints (rule 2.21): the line leaves or enters the frame on the side that faces the other end, at a port allocated symmetrically by rules 3.2 and 4.7, square-on to the frame. The line starts or ends on the outer edge of the frame and never begins inside it, except a line between a group and one of its own members, which meets the inner edge of the frame and crosses nothing else needlessly. A line to a group never runs along the frame edge. A frame endpoint that needs more ports or tracks adds room as rule 1.7 sets (legality).
  - id: "4.10"
    title: "Plain connection"
    title_in_text: true
    section: "S4"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.13","2.21","4.9"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 90
    blank_before: 1
    text: |-
      Plain connection. A plain connection is an undirected line, with no arrowheads and no relationship type, between a note and a node or group, or between two notes. It is drawn like any other line: sections 3 to 5 apply, a group end follows rule 4.9, its corners and crossings are scored by rule 2.13, and it may carry a line hint (rule 2.21). It is not a relationship and never enters the model.
  - id: "4.11"
    title: "Convergence"
    title_in_text: true
    section: "S4"
    kind: "routing-fault"
    stage: "R3"
    status: "active"
    pointer: ""
    params: []
    refs: ["2.10","3.2","4.7","5.8"]
    outranks: []
    yields: ["2.10","2.21","5.8"]
    pictures: ["pictures/markup-merge-into-end.png","pictures/markup-merge-into-end-detail.png","pictures/markup-merge-finish.png"]
    hint_overridable: true
    order: 91
    blank_before: 1
    text: |-
      Convergence. Allocate all target ports jointly (3.2, 4.7). A source directly above a target uses a straight top entry **only if its allocated source and target ports align**. An offset source uses the fewest-corner legal entry: top when reachable without a prohibited gap traverse, otherwise the side facing the source. Reserve the top-centre port for a legal straight convergence; distribute offset arrivals across the remaining free sides and slots. A converging line never runs along the gap immediately above the target or uses an S-jog into its top unless a legal line hint explicitly allows that routing fault. Within a 2.10 block, follow 2.10 instead. For fan lines covered by 5.8, defer to the hub-side and nesting choices permitted by 5.8.
  - id: "4.12"
    title: "Bend-removing port reassignment"
    title_in_text: false
    section: "S4"
    kind: "quality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: []
    refs: ["3.3","2.14"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 92
    blank_before: 1
    text: |-
      After routing, check every line that bends only to reach its port, because its port is offset from the line's approach or sits on a side that doesn't face the line. Look at the node's other lines on the same side, and on the next sides round where a line could legally use a different side. Swap or move their ports when that removes the bend. Keep a change only if it adds no crossing anywhere, adds no bend to any other line, keeps distinct ports, port order (3.3), minimum separation and every honoured hint, and strictly improves the score (2.14). Reroute only the lines affected. Repeat until no swap removes a bend, visiting each node at most once per pass so the search always ends. Hinted lines keep their hinted side and port.
  - id: "5.1"
    title: "One line per track"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "R5"
    status: "active"
    pointer: ""
    params: ["track_spacing","track_shortage_growth","corridor_capacity_buffer"]
    refs: ["1.7"]
    outranks: []
    yields: []
    pictures: []
    hint_overridable: false
    order: 94
    blank_before: 1
    text: |-
      Two lines never use the same track where their runs overlap. If a gap has fewer free tracks than lines, insert space as set by rule 1.7 and route again. Never enlarge an unrelated node to create track capacity; grow the gap instead. Initial band placement sizes each gap between columns and between bands for the forecast number of lines passing through it, plus corridor_capacity_buffer, rounded up and never less than one extra track. Gaps covered by a node that spans several columns are never corridors.
  - id: "5.2"
    title: "Fan nesting"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "R3"
    status: "active"
    pointer: ""
    params: []
    refs: ["5.8"]
    outranks: []
    yields: []
    pictures: ["fan-nesting-markup.png"]
    hint_overridable: false
    order: 95
    blank_before: 1
    text: |-
      In a fan, the line to the node furthest out takes the outermost track and port, and the line to the nearest node takes the innermost. Apply this to fan-out and fan-in, and to both halves of the fan (see fan-nesting-markup.png). Fans between columns follow rule 5.8.
  - id: "5.3"
    title: "Back-edge sides"
    title_in_text: false
    section: "S5"
    kind: "legality"
    stage: "R4"
    status: "active"
    pointer: ""
    params: []
    refs: []
