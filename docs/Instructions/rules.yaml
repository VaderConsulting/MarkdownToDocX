    hint_overridable: false
    order: 85
    blank_before: 1
    text: |-
      Put a Z's middle run on a track in the gap between the source and target ranks (see lr-fanout-markup.png).
  - id: "4.6"
    title: "No running along outlines"
    title_in_text: false
    section: "S4"
    kind: "legality"
