 text-anchor="middle" fill="#333" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16" font-weight="normal">Out</text><text y="84.76" text-anchor="start" fill="#333" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif" font-size="16" font-weight="normal"><tspan x="233.20000000000005" dy="0">Publish a manifest</tspan><tspan x="233.20000000000005" dy="24">(file list, sizes,</tspan><tspan x="233.20000000000005" dy="24">hashes) with each</tspan><tspan x="233.20000000000005" dy="24">drop so the consumer</tspan><tspan x="233.20000000000005" dy="24">can reject</tspan><tspan x="233.20000000000005" dy="24">incomplete uploads</tspan><tspan x="233.20000000000005" dy="24">and detect</tspan><tspan x="233.20000000000005" dy="24">tampering. Include a</tspan><tspan x="233.20000000000005" dy="24">stable batch</tspan><tspan x="233.20000000000005" dy="24">identifier and an</tspan><tspan x="233.20000000000005" dy="24">explicit completion</tspan><tspan x="233.20000000000005" dy="24">marker.</tspan></text></svg>